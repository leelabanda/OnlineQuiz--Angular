<form (ngSubmit)="updateProfile()">

  <label>Name</label>
  <input
      type="text"
      [(ngModel)]="user.name"
      name="name">

  <br><br>

  <label>Email</label>
  <input
      type="email"
      [(ngModel)]="user.email"
      name="email">

  <br><br>
  <button type="submit">
      Update
  </button>

</form>

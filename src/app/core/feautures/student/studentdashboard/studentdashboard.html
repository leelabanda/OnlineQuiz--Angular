<div class="dashboard-container">

  <h1>Welcome {{ studentName }}</h1>
  <h2>Student Dashboard</h2>

  <!-- STATS -->
  <div class="stats-grid">

    <div class="card">
      <h3>Available Quizzes</h3>
      <p class="stat-value">{{ availableQuizzes }}</p>
    </div>

    <div class="card">
      <h3>Completed Quizzes</h3>
      <p class="stat-value">{{ completedQuizzes }}</p>
    </div>
        <div class="card">
      <h3>Total Score</h3>
      <p class="stat-value">{{ totalScore }}</p>
    </div>

    <div class="card">
      <h3>Average Score</h3>
      <p class="stat-value">{{ averageScore }}%</p>
    </div>

  </div>

</div>

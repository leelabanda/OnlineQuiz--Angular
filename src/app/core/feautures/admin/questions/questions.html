<div class="form-container">
  <h2>Questions Create</h2>
<form [formGroup]="validateForm" (ngSubmit)="submitForm()">
  
  <div class="form-group">
    <label for="quiz">Quiz ID:</label>
    <input id="quiz" formControlName="quiz" type="text" />
  </div>

  <div class="form-group">
    <label for="questionType">Question Format:</label>
    <select id="questionType" formControlName="questionType">
      <option value="single">Multiple Choice (Single Answer - Radios)</option>
      <option value="multiple">Multiple Response (Multiple Answers - Checkboxes)</option>
      <option value="boolean">True / False (Two Options)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="questionText">Question Text:</label>
    <textarea id="questionText" formControlName="questionText"></textarea>
  </div>

  <div class="form-group">
    <label for="marks">Marks:</label>
    <input id="marks" formControlName="marks" type="number" />
  </div>

  <div class="options-container">
    <h3>Answer Choices</h3>
    
    <div formArrayName="options">
      @for (option of optionsArray.controls; track $index) {
        <div [formGroupName]="$index" class="option-row">
          
          @if (validateForm.value.questionType === 'multiple') {
            <input 
              type="checkbox" 
              formControlName="isCorrect" 
            />
          } @else {
            <input 
              type="radio" 
              name="dynamicCorrectMarker"
              [checked]="option.get('isCorrect')?.value === true"
              (change)="onRadioSelect($index)" 
            />
          }

          <input 
            type="text" 
            formControlName="optionText" 
            [readonly]="validateForm.value.questionType === 'boolean'"
            placeholder="Option Text {{ $index + 1 }}" 
          />

          @if (option.get('optionText')?.touched && option.get('optionText')?.invalid) {
            <small class="error-text">Required field.</small>
          }
        </div>
      }
    </div>
  </div>

  <button type="submit" class="submit-btn">Save Question</button>
</form>
</div>
